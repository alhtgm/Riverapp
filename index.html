<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/river-icon.png" />
    <link rel="apple-touch-icon" href="/river-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3E3A78" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="River" />
    <meta name="description" content="大学生向け課題管理アプリ。横スクロールのタイムラインで締め切りを可視化。" />
    <link rel="manifest" href="/manifest.json" />
    <!-- 文字: Noto Sans JP（可変ウェイト）。読み込みが終わるまでは端末のフォントで表示する -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" />
    <title>River — 課題タイムライン</title>
    <!-- テーマをちらつきなく適用 -->
    <script>
      (function(){
        var t = localStorage.getItem('river-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
